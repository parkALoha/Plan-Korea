<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-label="ญี่ปุ่น">
  <defs>
    <linearGradient id="jp-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf6ec"/><stop offset="0.45" stop-color="#fae1dc"/><stop offset="1" stop-color="#eab8ae"/>
    </linearGradient>
  </defs>
  <rect width="800" height="300" fill="url(#jp-sky)"/>
  <circle cx="666" cy="76" r="38" fill="#d9683a" opacity="0.85"/>

  <!-- เทือกเขาหลังฉาก — ต่ำและจาง ให้ฟูจิเป็นตัวเด่นตัวเดียว -->
