# ════════════════════════════════════════════════════════════════════════════
# gitleaks — ต่อยอดกฎมาตรฐาน · เพิ่ม allowlist เดียวที่แคบที่สุดเท่าที่ทำได้
# เจ้าของ: P1-Lead · 4 ก.ย. 2026 · P2 เจอตอนรันรอบยืนยันแล้วหยุด push
# ════════════════════════════════════════════════════════════════════════════
#
# ── ทำไมต้องมีไฟล์นี้ ────────────────────────────────────────────────────
# migration ของคลังสถานที่เขียนแถวเป็น `'place_id:ChIJ…', 'ChIJ…'` (ค่าซ้ำสองครั้งติดกัน)
# → เข้ารูป `key, value` ของกฎ `generic-api-key` → **แดง**
# 🔴 **ตัวข้อมูลไม่ใช่ความลับ** — Google Place ID เป็นตัวระบุสาธารณะ อยู่ใน URL และผลลัพธ์ API
#    และ `ChIJ…` มีในรีโปมานานแล้วโดยไม่เคยแดง (`0027_custom_places_google_id.sql` ·
#    `lib/googlePlaces.ts` ฯลฯ) ⇒ **ตัวที่ทำให้แดงคือ *รูปประโยค* ไม่ใช่ *ตัวข้อมูล***
#
# ── ✅ แก้ที่รากไปแล้วด้วย — ไฟล์นี้ไม่ใช่ทางออกทางเดียว ─────────────────
# migration ทั้งสามไฟล์ถูกเขียนใหม่เป็น `select … 'place_id:' || v.gpid, v.gpid`
# ⇒ **ไม่มีการพิมพ์ค่าซ้ำอีกแล้ว** และ `maps_query` ดริฟต์จาก `google_place_id` ไม่ได้
# 🔴 **แต่ commit `0d42983` อยู่ในประวัติไปแล้ว และ `gitleaks` สแกนประวัติ**
#    · เขียนประวัติทับ = อันตรายบน branch ที่ใช้ร่วมกัน (มี commit ของคนอื่นต่อจากนั้นแล้ว)
#    · `TEAM.md §3.1` ห้ามไว้ตรง ๆ หลังเคส `reset --soft`
#    ⇒ **allowlist คือทางที่เหลือ และต้องแคบพอที่จะไม่กลืนของจริง**
#
# ── 🔴 ทำไม allowlist นี้แคบพอ ──────────────────────────────────────────
# ผูกกับ **รูปของค่าที่ถูกจับ** ไม่ใช่กับ *พาธ*
# · `ChIJ` เป็น prefix ของ Google Place ID โดยเฉพาะ — คีย์ของ Google เอง (`AIza…`),
#   Supabase (`sb_secret_`/`sb_publishable_`/`eyJ…`) และ token ทั่วไป **ไม่ขึ้นต้นแบบนี้**
# · ⚠️ **ห้ามขยายเป็น allowlist ระดับโฟลเดอร์** — migration เป็นที่ที่ `grant`/คีย์เชื่อมต่อ
#   มีโอกาสหลุดเข้าไปจริง · ถ้าปิดทั้งโฟลเดอร์ ด่านนี้จะตายในที่ที่มันจำเป็นที่สุด
# · ✅ มีเทสต์ยืนยันว่า allowlist นี้ **ยังจับคีย์จริงได้** (`gitleaksAllowlist.test.ts`)

title = "plan-korea"

[extend]
useDefault = true

[[rules]]
  id = "generic-api-key"
  [rules.allowlist]
    description = "Google Place ID เป็นตัวระบุสาธารณะ ไม่ใช่ความลับ"
    regexTarget = "match"
    regexes = ['''ChIJ[A-Za-z0-9_\-]{15,}''']
