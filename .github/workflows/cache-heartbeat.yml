name: cache-heartbeat

# 🔴 เปลือกบาง — วางบน `main` ด้วยเหตุผลเดียวกับ `cache-warm.yml` ในไฟล์นี้ (อ่านหัวไฟล์นั้นก่อน)
# ตรรกะจริง (สูตรเพดาน · grace period · `cronScheduleEnabled()`) อยู่ที่
# `.github/workflows/cache-heartbeat.yml` + `lib/__tests__/cacheHeartbeat.test.ts` บน `platform`
# เท่านั้น — ไฟล์นี้แค่ checkout ไปที่นั่นแล้วรันคำสั่งเดิม **ไม่ก๊อปตรรกะมาไว้ที่นี่**
#
# ขอบเขตตาม `TEAM.md §3.5` (ผู้ใช้ตัดสิน 4 ก.ย. 2026 — ทาง ④): ครอบแค่ `.github/workflows/` บน
# `main` เท่านั้น เปิดคู่กับ `cache-warm.yml` เสมอ — ตัวเขียนอัตโนมัติที่แตะฐานจริง+เงินจริง
# ไม่ควรมีวันรันโดยไม่มีคนเฝ้า (จะแดง ~หลายวันระหว่างไล่ backlog แรก — คาดไว้แล้ว ดูไฟล์ต้นทาง)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 * * * *"   # รายชั่วโมง — ต้องตรงกับ cache-warm.yml เสมอ อย่าเปิด/ปิดแยกกัน

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: platform   # 🔴 ต้องระบุชัด — ดูคำเตือนเดียวกันใน cache-warm.yml

      - uses: actions/setup-node@v4
        with:
          node-version: '20.12.2'
          cache: npm
      - run: npm ci

      - name: ยืนยันว่า secret ชี้ engine-dev ก่อนแตะ DB
        run: .github/check-ci-target.py
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.DEV_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SERVICE_ROLE_KEY }}

      - name: จำนวนคีย์ที่ยังไม่ได้อุ่น เทียบเพดาน
        run: npx vitest run lib/__tests__/cacheHeartbeat.test.ts
        env:
          RLS_MATRIX_REQUIRED: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SERVICE_ROLE_KEY }}
          CACHE_MAX_MISSING_DETAILS: "0"
          CACHE_MAX_MISSING_PHOTOS: "1"
          CACHE_CEILING_GRACE_UNTIL: ""   # 🔴 ตั้งพร้อมกับไฟล์บน platform เท่านั้น — ดูไฟล์ต้นทางก่อนแก้
