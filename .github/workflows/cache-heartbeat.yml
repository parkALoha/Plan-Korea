name: cache-heartbeat

# ตอบคำถามเดียว: **แคชกำลังถูกอุ่นจริงไหม** — ไม่ใช่ "cron รันจบไหม" (P6 · 3 ก.ย. 2026)
#
# 🔴 แก้ 3 ก.ย. 2026 — ทิ้งแผนเดิม (เทียบ `fetched_at` กับ TTL) หลัง P1 ตรวจแล้วพบว่า **ไม่มี
#    TTL อยู่จริง** (route ไม่เคยอ่าน `fetched_at` · ตัวอุ่นเขียนด้วย `ON CONFLICT DO NOTHING`
#    ไม่เคยทับของเดิม) → วัดความสดจะแดงถาวรทันทีที่อุ่นครบ ทั้งที่ทุกอย่างทำงานถูก
#    (ตระกูล "ด่านที่แดงใส่คนที่ทำถูก จะถูกลบทั้งใบ")
#
# ✅ วัด **จำนวนคีย์ที่ยังไม่ได้อุ่น** แทน (`lib/__tests__/cacheHeartbeat.test.ts` — เหตุผลเต็มในหัวไฟล์นั้น)
#    ขาด = 0 → สุขภาพดี · ขาด > 0 ค้าง → มีคลังใหม่แต่ตัวอุ่นไม่ทำงาน
#    ⚠️ จับ "cron ตายในวันที่ไม่มีคลังใหม่" ไม่ได้ — กรณีนั้นให้ GitHub ส่งอีเมลเองตอน
#    `cache-warm.yml` (scheduled run) ล้ม สองด่านนี้ครอบคนละกรณี ไม่ใช่ด่านเดียวที่ต้องครอบทุกทาง
#
# 🔴 ยังเป็น `workflow_dispatch` เท่านั้น — เปิด `schedule` พร้อมกับ `cache-warm.yml`
#    ยิงจริงวันนี้ (3 ก.ย.) ได้ **141 คีย์ขาดใน place_details_cache** — ถูกต้องตามสภาพจริง
#    (ยังไม่มีตัวเขียน) แต่เปิด schedule ตอนนี้จะแดงทุกรอบเป็น noise ไม่ใช่สัญญาณ

on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "0 * * * *"   # TODO: เปิดพร้อม cache-warm.yml เมื่อตัวเขียนพร้อมทำให้ขาด=0 ได้จริง

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.12.2'
          cache: npm
      - run: npm ci

      - name: ยืนยันว่า secret ชี้ engine-dev ก่อนแตะ DB
        run: .github/check-ci-target.py
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.DEV_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SERVICE_ROLE_KEY }}

      # 🔴 ยิงจริงแล้ว (P6 · 3 ก.ย. 2026) — แดงตอนนี้ถูกต้อง ไม่ใช่บั๊กของเช็คนี้
      #    RLS_MATRIX_REQUIRED=1 ตามธรรมเนียมไฟล์อื่นทุกไฟล์ในชุดสด — "ข้าม" ต้องกลายเป็น "ล้ม"
      - name: จำนวนคีย์ที่ยังไม่ได้อุ่น
        run: npx vitest run lib/__tests__/cacheHeartbeat.test.ts
        env:
          RLS_MATRIX_REQUIRED: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SERVICE_ROLE_KEY }}
