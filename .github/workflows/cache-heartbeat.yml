name: cache-heartbeat

# ตอบคำถามเดียว: **แคชกำลังถูกอุ่นจริงไหม** — ไม่ใช่ "cron รันจบไหม" (P6 · 3 ก.ย. 2026)
#
# 🔴 แก้ 3 ก.ย. 2026 — ทิ้งแผนเดิม (เทียบ `fetched_at` กับ TTL) หลัง P1 ตรวจแล้วพบว่า **ไม่มี
#    TTL อยู่จริง** (route ไม่เคยอ่าน `fetched_at` · ตัวอุ่นเขียนด้วย `ON CONFLICT DO NOTHING`
#    ไม่เคยทับของเดิม) → วัดความสดจะแดงถาวรทันทีที่อุ่นครบ ทั้งที่ทุกอย่างทำงานถูก
#    (ตระกูล "ด่านที่แดงใส่คนที่ทำถูก จะถูกลบทั้งใบ")
#
# ✅ วัด **จำนวนคีย์ที่ยังไม่ได้อุ่น เทียบเพดาน** (`lib/__tests__/cacheHeartbeat.test.ts` — เหตุผลเต็มในหัวไฟล์นั้น)
#    ขาด > เพดาน → แดงทันที (ด่านทำงานจริงตั้งแต่วันนี้ ไม่ต้องรอตัวเขียนเสร็จ)
#    เพดาน − ขาด ≥ 20 → แดง "เพดานล้า ลดได้แล้ว" (พลิกเองเมื่อตัวอุ่นเริ่มทำงานจริง)
#    🔴 แก้ 3 ก.ย. 2026 (P1 ทัก) — เดิมห่อด้วย `it.fails` แล้วพบว่ารายงาน "ผ่าน" เสมอไม่ว่าขาดเท่าไหร่
#    ไม่มีอำนาจแยกแยะเลย ตอนที่ควรมีค่าที่สุด (ตอนที่ยังไม่มีตัวเขียน) — เปลี่ยนมาเป็นเพดานแทน
#    ⚠️ จับ "cron ตายในวันที่ไม่มีคลังใหม่" ไม่ได้ — กรณีนั้นให้ GitHub ส่งอีเมลเองตอน
#    `cache-warm.yml` (scheduled run) ล้ม สองด่านนี้ครอบคนละกรณี ไม่ใช่ด่านเดียวที่ต้องครอบทุกทาง
#
# 📌 ปรับเพดานโดยไม่ต้องแก้ไฟล์เทสต์: ตั้ง `CACHE_MAX_MISSING_DETAILS`/`CACHE_MAX_MISSING_PHOTOS`
#    ใน step ด้านล่าง (ว่าง/ไม่ตั้ง = ใช้ default 141 ของไฟล์เทสต์) — ตั้ง `=0` ได้ทันทีที่ตัวเขียนพร้อม
#
# 🔴 แก้ 3 ก.ย. 2026 (P6) — P1 อุ่น `place_details_cache` จริงแล้ว (174/174 · ขาด 0) เพดาน
#    `_DETAILS` เดิม (141) จึงล้าแล้ว ลดเป็น `0` ตามที่ heartbeat เตือน (วัดซ้ำเองก่อนแก้ ไม่เชื่อรายงาน)
#    · `place_photo_cache` **ยังไม่ถูกอุ่น** (P1 ตั้งใจรอให้เห็นเลขแยกก่อน — คำขอ Google คนละชนิด)
#    วัดจริง (3 ก.ย.): คลัง 174 · แคชแล้ว 33 · ขาด 141 เท่าเดิม → `_PHOTOS` ยังคงค่า default (141) ไว้
#
# 🔴 ยังเป็น `workflow_dispatch` เท่านั้น — เปิด `schedule` พร้อมกับ `cache-warm.yml`
#    (ยังรอผู้ใช้ยืนยัน secret `GOOGLE_MAPS_API_KEY` ตาม `cache-warm.yml`)

on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "0 * * * *"   # TODO: เปิดพร้อม cache-warm.yml เมื่อตัวเขียนพร้อมทำให้ขาด=0 ได้จริง

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.12.2'
          cache: npm
      - run: npm ci

      - name: ยืนยันว่า secret ชี้ engine-dev ก่อนแตะ DB
        run: .github/check-ci-target.py
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.DEV_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SERVICE_ROLE_KEY }}

      # 🔴 ลด _DETAILS เหลือ 0 แล้ว (P6 · 3 ก.ย. 2026) — place_details_cache อุ่นครบจริง วัดซ้ำเองยืนยัน
      #    RLS_MATRIX_REQUIRED=1 ตามธรรมเนียมไฟล์อื่นทุกไฟล์ในชุดสด — "ข้าม" ต้องกลายเป็น "ล้ม"
      #    _PHOTOS ยังว่าง = ใช้ default 141 ของไฟล์เทสต์ (photos ยังไม่ถูกอุ่น — วัดจริงตรงกัน)
      - name: จำนวนคีย์ที่ยังไม่ได้อุ่น เทียบเพดาน
        run: npx vitest run lib/__tests__/cacheHeartbeat.test.ts
        env:
          RLS_MATRIX_REQUIRED: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SERVICE_ROLE_KEY }}
          CACHE_MAX_MISSING_DETAILS: "0"
          CACHE_MAX_MISSING_PHOTOS: ""
