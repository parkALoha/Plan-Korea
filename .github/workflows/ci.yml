# CI ของงานแพลตฟอร์ม (E0) — เจ้าของ: P6-DevOps
#
# 🔴 branch นี้คือ `platform` เท่านั้น · `main` เป็นเว็บทริปที่ freeze อยู่จนกลับจากเกาหลี
#    workflow นี้ตั้ง `branches: [platform]` ไว้โดยตั้งใจ ห้ามเพิ่ม `main` จนกว่าผู้ใช้จะสั่ง
#    ไม่งั้น push เข้า main ระหว่างแก้บั๊กหน้างานจะไปสะดุด CI ที่ยังไม่เคยรันกับ main มาก่อน
name: CI

on:
  pull_request:
    branches: [platform]
  push:
    branches: [platform]
  # 🔴 **`workflow_dispatch` มีไว้เพื่อ job `readonly-storage` เท่านั้น** (P4 ขอ · P1 เคาะ · 27 ส.ค. 2026)
  #    job นั้นต้อง **เข้าโหมด read-only จริงและ commit ธง** (storage เป็นคนละ connection
  #    → เลี่ยง rollback-trick ของ `E3-AC7` ไม่ได้) → **บล็อก write ของทุกเซสชันตลอด window**
  #    · engine-dev เป็นฐานใบเดียวที่ 8 เซสชันใช้ร่วมกัน → **ห้ามผูกกับ push/PR/schedule เด็ดขาด**
  #      ไม่งั้นจะมีคนถูกบล็อกโดยไม่มีใครรู้ว่ามีคนกำลังใช้ฐานอยู่หรือเปล่า
  workflow_dispatch:
    inputs:
      confirm:
        description: 'พิมพ์ engine-dev เพื่อยืนยันว่ารู้ว่านี่จะบล็อก write ของทุกคน'
        required: true
        default: ''
      phase:
        description: 'reproduce = คาดว่าช่องยังเปิด · verify = คาดว่าปิดแล้ว (หลังลง migration)'
        required: true
        default: 'reproduce'
        type: choice
        options: [reproduce, verify]

# 🔴 `cancel-in-progress: false` ตั้งแต่ 26 ส.ค. 2026 — เดิมเป็น `true`
#    เหตุผล (P4 ชี้ · P6 ยืนยันกลไก): job ที่ถูก cancel **ถูก kill ไม่ใช่ throw**
#    → `finally` / `afterAll` ของ vitest **ไม่รัน** → cleanup ไม่เกิด
#    · ชุดสดสร้าง fixture จริงบนฐาน dev ที่ใช้ร่วม 8 เซสชัน → ถูกฆ่ากลางคัน = fixture ค้าง
#    · และถ้าวันหนึ่งมีเคสที่เปิด/ปิด state ร่วม (เช่นโหมด read-only) การถูกฆ่ากลางหน้าต่าง
#      **จะทิ้งฐานไว้ในสถานะที่ไม่มีใครตั้งใจ และไม่มี cleanup path ไหนกู้ได้**
#
# ⚠️ ข้อแลก: run ที่ถูกแซงจะ **วิ่งจนจบ** แทนที่จะถูกตัด → ผลช้าลง และกิน runner นานขึ้น
#    · แต่ GitHub เก็บ pending ได้ 1 อันต่อ group → push รัว ๆ จะ cancel **ตัวที่ยัง pending**
#      (ยังไม่เริ่มรัน = ไม่มี cleanup ให้ค้าง) **ไม่ใช่ตัวที่กำลังวิ่ง** ซึ่งคือสิ่งที่เราต้องการ
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ด่านเร็ว — ล้มใน ~30 วินาทีโดยไม่ต้องรอ npm ci
  guards:
    name: Guards (AC9 · AC10 · ref · link · .env · anchor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks ต้องเห็นประวัติทั้งหมด ไม่ใช่แค่ commit ล่าสุด

      # ── E0-AC9 (บังคับ) — หา secret ที่หลุดเข้า git ──────────────────────────
      # 🔴 เป็นด่าน ไม่ใช่ป้าย: ทำงานแม้ไม่มีใครอ่านกติกา
      # ⚠️ gitleaks-action ฟรีสำหรับ repo ของบัญชีส่วนตัว (parkALoha = type User)
      #    ถ้าวันหนึ่งย้าย repo ไปอยู่ใต้ GitHub organization จะต้องมี GITLEAKS_LICENSE
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── ด่าน AC10 · ref · link · anchor — ตรรกะอยู่ใน .github/guards.sh ──────────────
      # 🔴 self-test ต้องรัน "ก่อน" ด่านจริงเสมอ
      #    ถ้า guards.sh ถูกแก้จนไม่จับอะไรเลย ผลเขียวของ step ถัดไปจะไม่มีความหมาย
      #    — เราต้องรู้ว่าด่านยังทำงาน ก่อนจะเชื่อว่าด่านบอกว่าไม่มีปัญหา
      #    (กติกา P1 18 ส.ค. 2026: ทุก guard ต้องมีเทสต์ด้านลบ)
      - name: guards self-test (พิสูจน์ว่าด่านยังจับของผิดได้)
        run: .github/guards-selftest.sh

      - name: guards (AC10 · ref · link · .env · anchor) กับทรีจริง
        run: .github/guards.sh .
        env:
          # 🔴 allowlist ของจริงอยู่ที่ `.github/allowed-project-ref` (ไฟล์ที่ commit) ตั้งแต่ 24 ส.ค. 2026
          #    secret ตัวนี้ **ไม่ใช่แหล่งความจริงอีกแล้ว** — เหลือหน้าที่เดียวคือ
          #    "ถ้าตั้งไว้ ต้องตรงกับไฟล์" = จับกรณี secret ของ CI กับ repo เพี้ยนออกจากกัน
          #    ⚠️ ไม่ตั้งก็ได้ ไม่แดง · และด่าน link ตัวจริงไม่เคยรันบน CI อยู่แล้ว
          #       เพราะ `.temp/` ถูก gitignore ไม่มีไฟล์ให้ตรวจที่นี่
          DEV_PROJECT_REF: ${{ secrets.DEV_PROJECT_REF }}

      # ── ด่านชั่วคราว diff-guard ถูกปลดแล้ว 18 ส.ค. 2026 ────────────────────────────
      # เงื่อนไขที่สคริปต์เขียนไว้ ("จนกว่าเรื่อง Vercel จะปิด") เป็นจริงแล้ว:
      # ผู้ใช้ตั้ง Ignored Build Step + Vercel Authentication · หมุน TRIP_PIN แล้ว · P1 อนุมัติให้ปลด
      #
      # 🔴 ไฟล์ .github/diff-guard.sh และ diff-guard-selftest.sh **ยังอยู่โดยตั้งใจ** ไม่ได้ลบ
      #    วันหน้าถ้าต้องแช่แข็ง path ชุดใดชุดหนึ่งอีก ให้เอา 2 step กลับมาแทนที่จะเขียนใหม่
      #    (self-test 10 เคสยังใช้ได้ทันที รวมเคสที่กันบั๊ก no-op บน CI)

  verify:
    name: Lint · Test · Types · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # ตรึงให้ตรงกับเครื่องผู้ใช้ (v20.12.2) — ยังไม่ใช้ .nvmrc เพราะเป็นไฟล์ใหม่ที่ root
          # 🔴 Node 20 หมดอายุ (EOL เม.ย. 2026) แล้ว · แผนขยับเป็น 22 อยู่ใน devops.md §2.3
          #    ห้ามขยับก่อน 21 ต.ค. — next dev พังตอนอยู่เกาหลีคือความเสี่ยงที่รับไม่ได้
          node-version: '20.12.2'
          cache: npm
      - run: npm ci

      - run: npm run lint

      # 🔴 job นี้ **ไม่มี creds โดยการออกแบบ** — เราตั้งใจไม่ให้ `service_role` กระจายเกิน job `rls`
      #    → เคสสด (`describe.runIf(hasCreds)`) ถูกข้าม **ซึ่งเป็นพฤติกรรมที่ถูก ไม่ใช่ของที่ต้องแก้**
      #    แต่ `runIntegrityReporter` (P4) ทำให้มันแดงทุก push ตั้งแต่ 26 ส.ค. — P6 วัดมา
      #
      # 🎯 ธงประกาศอยู่ **ตรงนี้ ไม่ใช่ใน `vitest.config.mts`** เพื่อให้ข้อยกเว้น**เห็นใน diff**
      #    รูปเดียวกับ `migration-guard-exempt` / `no-policy-tables`
      # ⚠️ มันผ่อน **เฉพาะการข้าม** — `suiteErrors` และ "ไม่มีเคสให้รันเลย" ยังล้มเสมอ
      #    และ reporter ยัง**พิมพ์จำนวนที่ข้าม**ออกมาให้เห็นใน log ทุกรอบ
      # 🔴 ห้ามตั้งธงนี้ใน job `rls` — ที่นั่นการข้ามคือความล้มเหลวจริง
      - run: npm test
        env:
          EXPECT_SKIPPED_TESTS: "1"

      # 🔴 ต้องมาก่อน tsc เสมอ — Next 16 สร้าง global type (`LayoutProps`/`PageProps`/`RouteContext`)
      #    ตอน build/dev · worktree ที่เพิ่ง clone ยังไม่มีไฟล์พวกนี้ `tsc --noEmit` จะล้มทันทีด้วย
      #    `app/layout.tsx(31,50): TS2304: Cannot find name 'LayoutProps'`
      #    ยืนยันของจริงแล้วในทรี platform (18 ส.ค. 2026) — ล้มก่อน typegen · ผ่านหลัง typegen
      #    ดู node_modules/next/dist/docs/01-app/02-guides/upgrading/version-16.md:297
      - run: npx next typegen
      - run: npx tsc --noEmit

      - name: Cache .next
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.[jt]s?(x)') }}
          restore-keys: next-${{ hashFiles('package-lock.json') }}-

      - run: npm run build
        env:
          # 🔴 ค่าปลอมล้วน · ห้ามใส่ key จริงของ Google หรือ Supabase ที่นี่ ไม่ว่ากรณีใด
          #    next build ต้องการแค่ "ตัวแปรมีค่า" — ทั้ง 4 หน้าเป็น "use client" (B8)
          #    จึงไม่มี fetch จริงตอน build · ถ้า P3 พลิกเป็น Server Component ต้องรื้อ step นี้ใหม่
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_GOOGLE_MAPS_EMBED_KEY: placeholder-not-a-real-key
          GOOGLE_MAPS_API_KEY: placeholder-not-a-real-key

      # 🔴 `E6-AC10` เทียบรอบต่อรอบ (P1 เสนอ · P6 สร้าง · 28 ส.ค. 2026)
      #    เดิมทั้งคู่คิดว่า `npm run build` พิมพ์ตาราง "First Load JS" อยู่แล้ว — **Next.js 16.3.0
      #    ในเรพนี้ไม่พิมพ์เลย** (`AGENTS.md` เตือนไว้แล้วว่านี่ไม่ใช่ Next ที่อยู่ในความจำ)
      #    ใช้ `.next/server/app/**/*_client-reference-manifest.js` แทน — ตัวเดียวที่มีจริง
      #    ทดสอบแล้วกับทั้ง 40 route ในเรพจริง: parse error 0 · chunk หาย 0
      #    🔴 เทียบรอบต่อรอบเท่านั้น ไม่ตัดสินว่าโตเท่าไหร่ถึงเกินไป (ของคนตั้ง AC) · แดงเฉพาะ "วัดไม่ได้"
      - run: .github/check-bundle-size.py .

      # 🔴 `tripDataInBundle.test.ts` ของ P3 (`72bf8f8`) ต้องมี step หลัง `npm run build` ที่นี่
      #    (P3 ชี้ · P6 ต่อสาย · 28 ส.ค. 2026) — `npm test` ที่บรรทัดบนรันใน step **ก่อน** build
      #    → ถ้าไม่มี step นี้ ด่านนี้จะเจอ *ไม่มี build ให้ตรวจ* แล้ว **skip พร้อมเตือนทุกรอบตลอดไป**
      #    ตรงกับ `RLS_MATRIX_REQUIRED` เป๊ะ: ตั้งธงหลัง build ที่มีจริง → ข้ามกลายเป็นล้ม
      #    ไม่งั้นเราจะมี "เทสต์ที่ผ่านได้ด้วยการไม่เคยรัน" ซึ่งเป็นสิ่งที่ธงตัวนั้นมีไว้กันพอดี
      - name: ข้อมูลทริปเกาหลีต้องไม่หลุดเข้าบันเดิลของ route แพลตฟอร์ม (ต้องมี build จริง)
        env:
          BUNDLE_GUARD_REQUIRED: '1'
        run: npx vitest run lib/__tests__/tripDataInBundle.test.ts

  # ── E1: RLS matrix ของ P4 — ต้องรันจริงกับ engine-dev ───────────────────────────
  # 🔴 แยกเป็น job ของตัวเองโดยตั้งใจ ไม่ยัดเข้า `verify`
  #    เพราะ job นี้จะ **แดงจนกว่าผู้ใช้จะตั้ง secret ครบ** — ถ้าปนอยู่ใน verify
  #    มันจะทำให้ lint/test/build แดงไปด้วย แล้วทุกคนจะเรียนรู้ที่จะข้าม CI ทั้งใบ
  #    แยกไว้ = ความแดงมีเจ้าของชัดเจน และอ่านออกว่าค้างเพราะอะไร
  #
  # 🔴 `RLS_MATRIX_REQUIRED=1` คือหัวใจ — P4 เรียกชุดนี้ว่า "เทสต์ที่ผ่านได้ด้วยการไม่เคยรัน"
  #    ไม่มี creds = vitest `skip` ซึ่ง **อ่านเป็นเขียวใน CI** (ยืนยันแล้ว: `npm test` วันนี้
  #    สรุปว่า "18 passed" ทั้งที่มี 15 skipped ซ่อนอยู่) · flag นี้เปลี่ยน skip เป็น fail
  #
  # ⛔ ห้ามใส่ค่าของ Supabase ทริปจริงในสาม secret นี้ ไม่ว่ากรณีใด — ปลายทางคือ engine-dev เท่านั้น
  rls:
    name: RLS matrix (engine-dev)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 🔴 group ผูกกับ **ฐาน** ไม่ใช่กับ ref ของ git (P4 ถาม · 26 ส.ค. 2026)
    #    `concurrency` ระดับ workflow ข้างบนผูกกับ `github.ref` → **สอง branch = คนละ group**
    #    วันนี้ทุกคนอยู่ `platform` จึงกันกันเองอยู่แล้ว **แต่กันโดยบังเอิญ ไม่ใช่โดยเจตนา**
    #    วันที่มีสาขาที่สอง (PR/`E5`) การกันนั้นหายเงียบ ๆ โดยไม่มีใครแก้อะไรเลย
    #    → group นี้ทำให้ **ทุกคนที่แตะ engine-dev ต่อคิวกัน ไม่ว่ามาจาก ref ไหน**
    # ⚠️ กันได้แค่ฝั่ง CI · **การรัน `npx vitest` บนเครื่องของ 8 เซสชัน ไม่มีอะไรกันเลย**
    #    ซึ่งเป็นแหล่งชนหลัก — เคสที่แก้ state ร่วมต้องกันตัวเองด้วย (ปฏิเสธรันถ้าโหมดเปิดอยู่)
    concurrency:
      group: engine-dev-live
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.12.2'
          cache: npm
      - run: npm ci
      # 🔴 ด่านนี้ต้องมาก่อน vitest เสมอ — job นี้คือ **จุดเดียวใน CI ที่แตะ Supabase จริง**
      #    ไม่มี `db push` ใน CI เลย แต่ vitest ตัวนี้ยิง REST เข้า DB ด้วย service_role
      #    ถ้า secret ถูกตั้งผิดใบ มันจะรันเมทริกซ์ใส่โปรเจกต์นั้น **อัตโนมัติ ไม่มีคนดู**
      #    ด่าน `do $guard$` ใน SQL กันตรงนี้ไม่ได้ — มันกันแค่ตอน migration (ดู D48)
      - name: ยืนยันว่า secret ชี้ engine-dev ก่อนแตะ DB
        run: .github/check-ci-target.py
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.DEV_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SERVICE_ROLE_KEY }}

      # 🔴 ต้องมาหลัง ci-target (ยืนยันว่าคุยกับฐานถูกใบ) แต่ก่อน vitest
      #    ถ้าโหมด read-only เปิดค้างอยู่ ชุดสดจะพ่นความล้มเหลวเต็มไปหมด
      #    **แล้วคนจะไปไล่หาบั๊กใน policy ที่ไม่มีบั๊ก** — ด่านนี้ประกาศแทนว่า
      #    "ผลรอบนี้ไม่มีความหมาย" ไม่ใช่ "โค้ดพัง" (รูปเดียวกับ applied_migrations)
      - name: โหมด read-only เปิดอยู่ไหม (ผลจะมีความหมายไหม)
        run: .github/check-readonly-mode.py
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SERVICE_ROLE_KEY }}

      - name: RLS matrix — skip ต้องกลายเป็น fail
        run: npx vitest run lib/__tests__/rlsMatrix.test.ts
        env:
          RLS_MATRIX_REQUIRED: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.DEV_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SERVICE_ROLE_KEY }}

  # ══════════════════════════════════════════════════════════════════════════
  # `E3` — เทสต์พฤติกรรม read-only ที่ครอบ **storage** (P4 เป็นเจ้าของเทสต์ · P6 เป็นเจ้าของ job)
  # ══════════════════════════════════════════════════════════════════════════
  # 🔴 **job นี้ไม่รันเองตลอดกาล** — `workflow_dispatch` เท่านั้น
  #    เหตุผลไม่ใช่ความระมัดระวังทั่วไป แต่เป็นข้อเท็จจริงของกลไก:
  #    เทสต์ต้อง **commit ธงโหมด** (storage คนละ connection → rollback-trick ใช้ไม่ได้)
  #    → **ทุก write ของทุกเซสชันถูกบล็อกตลอด window** · ฐานใบนี้ 8 เซสชันใช้ร่วมกัน
  readonly-storage:
    name: 'E3 · read-only ครอบ storage (ต้องกดเอง)'
    # 🔴 กันไม่ให้มันติดไปกับ push/PR แม้ `on:` จะมี trigger พวกนั้นสำหรับ job อื่น
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 🔴 **group เดียวกับ job `rls` โดยเจตนา — ข้อนี้สำคัญที่สุดในไฟล์นี้**
    #    `rls` ยิงเมทริกซ์ที่ **เขียนจริง** ใส่ engine-dev · ถ้าสองอันนี้คนละ group
    #    มันจะทับหน้าต่างกันได้ → เมทริกซ์ RLS จะแดงเพราะ *เขียนไม่ได้* ไม่ใช่เพราะ policy ผิด
    #    **และมันจะดูเหมือนบั๊กความปลอดภัยทุกประการ** · ผู้ใช้จะไล่ผิดทางทั้งวัน
    concurrency:
      group: engine-dev-live
      cancel-in-progress: false
    steps:
      # ① ยืนยันด้วยการพิมพ์ — กันการกดพลาดจากหน้า Actions
      - name: ยืนยันว่ารู้ว่ากำลังทำอะไร
        run: |
          if [ "${{ inputs.confirm }}" != "engine-dev" ]; then
            echo "🔴 ต้องพิมพ์ engine-dev ในช่อง confirm"
            echo "   job นี้จะ **บล็อก write ของทุกเซสชัน** ตลอดหน้าต่างที่รัน"
            exit 1
          fi
          echo "▶️ phase = ${{ inputs.phase }}"

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.12.2'
          cache: npm
      - run: npm ci

      - name: ยืนยันว่า secret ชี้ engine-dev ก่อนแตะ DB
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.DEV_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SERVICE_ROLE_KEY }}
          ALLOWED_PROJECT_REF: ${{ secrets.DEV_PROJECT_REF }}
        run: .github/check-ci-target.py

      # ② 🔴 **ปฏิเสธที่จะเริ่ม ถ้าโหมดเปิดค้างอยู่แล้ว**
      #    โหมดเปิดอยู่ = มีคนอื่นอยู่ในหน้าต่างของเขา หรือหน้าต่างก่อนหน้าค้าง
      #    ทั้งสองกรณี **การเข้าไปซ้อนจะทำให้ cleanup ของสองฝั่งชนกัน**
      - name: pre-flight — โหมดต้องปิดอยู่ก่อนเริ่ม
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SERVICE_ROLE_KEY }}
        run: .github/check-readonly-mode.py

      # 🔴 **นิยามชุดไฟล์จาก "ใช้ธงนี้จริงไหม" ไม่ใช่ชื่อไฟล์ ไม่ใช่ list ตายตัว**
      #    (P4 ขอ · P6 ตัดสิน · แก้ไป 2 รอบในวันเดียว 27 ส.ค. 2026)
      #
      #    ① P4 เพิ่ม `readOnlyPaths.test.ts` แล้วมันไม่เคยรันเลยเพราะ step เดิม hardcode ชื่อไฟล์เดียว
      #    ② P4 เสนอ glob `readOnly*.test.ts` — วัดแล้วมันกวาด `readOnlyCoverage.test.ts` เข้ามาด้วย
      #       (เทสต์ปกติที่รันใน job `verify` อยู่แล้ว มี `skipped` 2 เคสที่ต้องพึ่ง
      #       `EXPECT_SKIPPED_TESTS=1` ซึ่ง job นี้ไม่ได้ตั้ง) → เปลี่ยนเป็น `grep -l 'READ_ONLY_MODE_TEST'`
      #    ③ P4 พบว่า `grep` ธรรมดาแมตช์คำในคอมเมนต์/ข้อความ warn ด้วย ไม่ใช่แค่การใช้งานจริง
      #       → เปลี่ยนเป็น `grep -l 'process\.env\.READ_ONLY_MODE_TEST'`
      #    ④ 🔴 **P4 ค้านข้อ ③ ถูก**: ไฟล์ที่เขียน `const { READ_ONLY_MODE_TEST } = process.env`
      #       (destructure แทน dot-access) จะ**หลุดออกเงียบ ๆ** — และนี่อันตรายกว่าจับเกิน
      #       เพราะไฟล์หลุดไป *หนึ่ง* ไฟล์ไม่ทำให้เซตว่าง (ยังมีไฟล์อื่น) → empty-set guard ไม่ยิง
      #       → job ยังเขียว → **เคสความปลอดภัยหายไปเงียบ ๆ** โดยไม่มีสัญญาณอะไรเลย
      #
      #    P4 เสนอ ⑤ ต่อ: strip คอมเมนต์ก่อนด้วย `grep -n | grep -v comment-prefix` แล้วค่อย
      #    match ชื่อธงเปล่า ๆ — **แต่ระหว่างทดสอบเอง P4 เจอว่า `grep -n` ใส่ prefix ชื่อไฟล์
      #    เฉพาะตอนกวาดหลายไฟล์ · ไฟล์เดียวไม่ใส่** → regex ที่คาด prefix จะพังเงียบตอนเหลือไฟล์เดียว
      #    🎯 **หลักการของ P4 ถูก (strip แล้วค่อย match) — implementation ด้วย grep/line-prefix เปราะ**
      #
      #    ✅ **ทางที่ใช้จริง: `.github/list-readonly-live-tests.py`** — ใช้ `_tsscan.strip_comments`
      #       ตัวเดียวกับที่ `check-naive-strip.py` บังคับทุกด่านให้ใช้ (เดินทีละตัวอักษร รู้ว่าอยู่ใน
      #       สตริง/คอมเมนต์ไหม) แทนการ parse บรรทัดด้วย grep — ไม่พังกับ `https://` ไม่พังกับไฟล์เดียว
      #       ไม่ต้องเดาสไตล์การเขียน (`process.env.X` หรือ destructure) เพราะตัดคอมเมนต์ก่อนเสมอ
      #       แล้วชื่อธงที่เหลือคือของจริงเสมอ — ทดสอบแล้วกับ decoy ทั้งสองทิศ (destructure + comment-only)
      #       พร้อมไฟล์จริงสามไฟล์ในทรี ไม่ใช่แค่พาธนอกทรี
      #
      #    🔴 **เซตว่าง = ตัวไล่พัง ไม่ใช่ "ไม่มีอะไรให้รัน"** (รอบที่ 5 ของทีมในวันนี้) — สคริปต์เองจัดการให้
      #
      #    ⚠️ **ทดสอบใน bash โดยตรง ไม่ใช่ zsh** — ตอนแรกทดสอบใน zsh interactive shell
      #       แล้ว `$FILES` (หลายบรรทัด) ไม่ถูก word-split เพราะ zsh ไม่ split unquoted var
      #       โดยปริยาย ผลคือ vitest เห็นเป็น 1 อาร์กิวเมนต์ที่มี newline ข้างใน → "No test
      #       files found" · **`run:` ของ GitHub Actions ใช้ bash เสมอ ไม่ใช่ shell ของเครื่อง
      #       ที่พิมพ์คำสั่งทดสอบ** — ต้องทดสอบด้วย `bash -c '...'` ไม่ใช่รันตรง ๆ ในเทอร์มินัล
      - name: รันเทสต์ (เข้าโหมดจริง)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.DEV_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SERVICE_ROLE_KEY }}
          READ_ONLY_MODE_TEST: '1'
          READ_ONLY_MODE_PHASE: ${{ inputs.phase }}
        run: |
          FILES="$(.github/list-readonly-live-tests.py .)" || exit 1
          echo "ไฟล์ที่รัน: $FILES"
          npx vitest run $FILES

      # ③ 🔴 **ตรวจ *เสมอ* ว่าโหมดปิดแล้ว — รวมถึงตอนเทสต์ล้มหรือถูกยกเลิก**
      #    `afterAll` ของ vitest ไม่รันเมื่อ job ถูก kill · ตาข่ายจริงคือ expiry ฝั่ง DB (P4 ตั้งสั้น)
      #    ขั้นนี้ไม่ได้ *ปิด* ให้ — มันทำให้ "ฐานค้างอยู่ในโหมด read-only" **ดังแทนที่จะเงียบ**
      #    🎯 ต่างกันตรงที่: เงียบ = คนถัดไปเจอ write ล้มโดยไม่รู้สาเหตุ · ดัง = มีคนไปปิดได้ทันที
      - name: post-flight — โหมดต้องกลับไปปิด (รันเสมอ)
        if: always()
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SERVICE_ROLE_KEY }}
        run: |
          if .github/check-readonly-mode.py; then
            echo "✅ โหมดปิดแล้ว — ฐานกลับสู่สภาพปกติ"
          else
            echo "::error::🔴 engine-dev **ยังอยู่ในโหมด read-only** หลัง job จบ"
            echo "::error::ทุกเซสชันจะเขียนไม่ได้จนกว่า expiry จะหมด หรือมีคนปิดด้วยมือ"
            echo "::error::→ ปิดด้วย set_system_mode (ใช้ named params) แล้วรัน .github/check-readonly-mode.py ยืนยัน"
            exit 1
          fi
