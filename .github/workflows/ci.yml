# CI ของงานแพลตฟอร์ม (E0) — เจ้าของ: P6-DevOps
#
# 🔴 branch นี้คือ `platform` เท่านั้น · `main` เป็นเว็บทริปที่ freeze อยู่จนกลับจากเกาหลี
#    workflow นี้ตั้ง `branches: [platform]` ไว้โดยตั้งใจ ห้ามเพิ่ม `main` จนกว่าผู้ใช้จะสั่ง
#    ไม่งั้น push เข้า main ระหว่างแก้บั๊กหน้างานจะไปสะดุด CI ที่ยังไม่เคยรันกับ main มาก่อน
name: CI

on:
  pull_request:
    branches: [platform]
  push:
    branches: [platform]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ด่านเร็ว — ล้มใน ~30 วินาทีโดยไม่ต้องรอ npm ci
  guards:
    name: Guards (AC9 · AC10 · ref · anchor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks ต้องเห็นประวัติทั้งหมด ไม่ใช่แค่ commit ล่าสุด

      # ── E0-AC9 (บังคับ) — หา secret ที่หลุดเข้า git ──────────────────────────
      # 🔴 เป็นด่าน ไม่ใช่ป้าย: ทำงานแม้ไม่มีใครอ่านกติกา
      # ⚠️ gitleaks-action ฟรีสำหรับ repo ของบัญชีส่วนตัว (parkALoha = type User)
      #    ถ้าวันหนึ่งย้าย repo ไปอยู่ใต้ GitHub organization จะต้องมี GITLEAKS_LICENSE
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── ด่าน AC10 · ref · link · anchor — ตรรกะอยู่ใน .github/guards.sh ──────────────
      # 🔴 self-test ต้องรัน "ก่อน" ด่านจริงเสมอ
      #    ถ้า guards.sh ถูกแก้จนไม่จับอะไรเลย ผลเขียวของ step ถัดไปจะไม่มีความหมาย
      #    — เราต้องรู้ว่าด่านยังทำงาน ก่อนจะเชื่อว่าด่านบอกว่าไม่มีปัญหา
      #    (กติกา P1 18 ส.ค. 2026: ทุก guard ต้องมีเทสต์ด้านลบ)
      - name: guards self-test (พิสูจน์ว่าด่านยังจับของผิดได้)
        run: .github/guards-selftest.sh

      - name: guards (AC10 · ref · link · anchor) กับทรีจริง
        run: .github/guards.sh .
        env:
          DEV_PROJECT_REF: ${{ secrets.DEV_PROJECT_REF }}

      # ── ด่านชั่วคราว diff-guard ถูกปลดแล้ว 18 ส.ค. 2026 ────────────────────────────
      # เงื่อนไขที่สคริปต์เขียนไว้ ("จนกว่าเรื่อง Vercel จะปิด") เป็นจริงแล้ว:
      # ผู้ใช้ตั้ง Ignored Build Step + Vercel Authentication · หมุน TRIP_PIN แล้ว · P1 อนุมัติให้ปลด
      #
      # 🔴 ไฟล์ .github/diff-guard.sh และ diff-guard-selftest.sh **ยังอยู่โดยตั้งใจ** ไม่ได้ลบ
      #    วันหน้าถ้าต้องแช่แข็ง path ชุดใดชุดหนึ่งอีก ให้เอา 2 step กลับมาแทนที่จะเขียนใหม่
      #    (self-test 10 เคสยังใช้ได้ทันที รวมเคสที่กันบั๊ก no-op บน CI)

  verify:
    name: Lint · Test · Types · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # ตรึงให้ตรงกับเครื่องผู้ใช้ (v20.12.2) — ยังไม่ใช้ .nvmrc เพราะเป็นไฟล์ใหม่ที่ root
          # 🔴 Node 20 หมดอายุ (EOL เม.ย. 2026) แล้ว · แผนขยับเป็น 22 อยู่ใน devops.md §2.3
          #    ห้ามขยับก่อน 21 ต.ค. — next dev พังตอนอยู่เกาหลีคือความเสี่ยงที่รับไม่ได้
          node-version: '20.12.2'
          cache: npm
      - run: npm ci

      - run: npm run lint
      - run: npm test

      # 🔴 ต้องมาก่อน tsc เสมอ — Next 16 สร้าง global type (`LayoutProps`/`PageProps`/`RouteContext`)
      #    ตอน build/dev · worktree ที่เพิ่ง clone ยังไม่มีไฟล์พวกนี้ `tsc --noEmit` จะล้มทันทีด้วย
      #    `app/layout.tsx(31,50): TS2304: Cannot find name 'LayoutProps'`
      #    ยืนยันของจริงแล้วในทรี platform (18 ส.ค. 2026) — ล้มก่อน typegen · ผ่านหลัง typegen
      #    ดู node_modules/next/dist/docs/01-app/02-guides/upgrading/version-16.md:297
      - run: npx next typegen
      - run: npx tsc --noEmit

      - name: Cache .next
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.[jt]s?(x)') }}
          restore-keys: next-${{ hashFiles('package-lock.json') }}-

      - run: npm run build
        env:
          # 🔴 ค่าปลอมล้วน · ห้ามใส่ key จริงของ Google หรือ Supabase ที่นี่ ไม่ว่ากรณีใด
          #    next build ต้องการแค่ "ตัวแปรมีค่า" — ทั้ง 4 หน้าเป็น "use client" (B8)
          #    จึงไม่มี fetch จริงตอน build · ถ้า P3 พลิกเป็น Server Component ต้องรื้อ step นี้ใหม่
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_GOOGLE_MAPS_EMBED_KEY: placeholder-not-a-real-key
          GOOGLE_MAPS_API_KEY: placeholder-not-a-real-key

  # ── E1: RLS matrix ของ P4 — ต้องรันจริงกับ engine-dev ───────────────────────────
  # 🔴 แยกเป็น job ของตัวเองโดยตั้งใจ ไม่ยัดเข้า `verify`
  #    เพราะ job นี้จะ **แดงจนกว่าผู้ใช้จะตั้ง secret ครบ** — ถ้าปนอยู่ใน verify
  #    มันจะทำให้ lint/test/build แดงไปด้วย แล้วทุกคนจะเรียนรู้ที่จะข้าม CI ทั้งใบ
  #    แยกไว้ = ความแดงมีเจ้าของชัดเจน และอ่านออกว่าค้างเพราะอะไร
  #
  # 🔴 `RLS_MATRIX_REQUIRED=1` คือหัวใจ — P4 เรียกชุดนี้ว่า "เทสต์ที่ผ่านได้ด้วยการไม่เคยรัน"
  #    ไม่มี creds = vitest `skip` ซึ่ง **อ่านเป็นเขียวใน CI** (ยืนยันแล้ว: `npm test` วันนี้
  #    สรุปว่า "18 passed" ทั้งที่มี 15 skipped ซ่อนอยู่) · flag นี้เปลี่ยน skip เป็น fail
  #
  # ⛔ ห้ามใส่ค่าของ Supabase ทริปจริงในสาม secret นี้ ไม่ว่ากรณีใด — ปลายทางคือ engine-dev เท่านั้น
  rls:
    name: RLS matrix (engine-dev)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.12.2'
          cache: npm
      - run: npm ci
      - name: RLS matrix — skip ต้องกลายเป็น fail
        run: npx vitest run lib/__tests__/rlsMatrix.test.ts
        env:
          RLS_MATRIX_REQUIRED: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.DEV_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SERVICE_ROLE_KEY }}
