name: cache-warm

# `Q3` ก้าวที่ 2 — ตัวรัน "อุ่นแคช" ที่ถือ service_role และอยู่นอกเส้นทาง request (P1 ขอ · P6 ทำ)
#
# 🔴 แก้ 3 ก.ย. 2026 — ตัวเขียนของ P1 เสร็จแล้ว (`lib/engine/cacheWarmWrite.ts` +
#    `lib/__tests__/cacheWarmRun.test.ts`) ต่อสายจริงแล้ว **แต่ยังเป็น `workflow_dispatch` เท่านั้น**
#    ห้ามเปิด `schedule` จนกว่า:
#    ① **ผู้ใช้อนุมัติให้รันครั้งแรก** — ตัวรันนี้ยิง Google จริงและเขียนฐานจริง ไม่เคยถูกรันสักครั้ง
#       P1 เสนอให้เริ่มด้วย `limit: 3` (ค่า default ของ dispatch input) เพื่อดูรายงานก่อนปล่อยเต็ม
#    ② ตกลงกันเรื่องความถี่ที่สอดคล้องกับ rate limit ฝั่ง Google (ยังไม่ตัดสิน)
#    ③ TTL ยังไม่มีมติ — ตัวเขียนนี้เติมเฉพาะคีย์ที่ *ขาด* เท่านั้น ไม่รีเฟรชของเก่า
#
# 🔴 อย่าใส่ `CRON_SECRET`/เรียกผ่าน Next.js API — service_role key ต้องอยู่ที่เดียวกับที่มันอยู่แล้ว
#    (secret ของ job `rls` ใน `ci.yml`) ไม่ใช่โผล่ในที่ที่สาม
#
# ⚠️ **ต้องมี secret `GOOGLE_MAPS_API_KEY` (คีย์จริง ไม่ใช่ placeholder ที่ job `verify` ใช้) —
#    ยังไม่ยืนยันว่ามีอยู่ใน repo secrets** เจ้าของ repo ต้องเพิ่มก่อนรันจริงครั้งแรก

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "เพดานจำนวนคีย์ที่จะอุ่นรอบนี้ (P1 เสนอ 3 สำหรับรันครั้งแรก)"
        required: false
        default: "3"

jobs:
  warm:
    runs-on: ubuntu-latest
    # 🔴 เหมือน job `rls` ทุกประการ — กันสองรอบชนกันบนฐานเดียวกัน (schedule ในอนาคตจะรันถี่กว่า push)
    concurrency:
      group: engine-dev-live
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.12.2'
          cache: npm
      - run: npm ci

      # 🔴 ต้องมาก่อนแตะฐานเสมอ — ของเดิมที่ job `rls` ใช้อยู่แล้ว ไม่เขียนด่านใหม่ซ้ำ
      - name: ยืนยันว่า secret ชี้ engine-dev ก่อนแตะ DB
        run: .github/check-ci-target.py
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.DEV_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SERVICE_ROLE_KEY }}

      # 🔴 CACHE_WARM_RUN=1 ต้องตั้งชัดเจน — ค่าตั้งต้นของไฟล์เทสต์คือ "ไม่ทำงาน" โดยตั้งใจ
      #    CACHE_WARM_LIMIT ใช้ envInt() (trim แล้วเช็คว่าง) ไม่ใช่ `??` — GH Actions ให้ input
      #    ที่เว้นว่างเป็นสตริงว่าง ไม่ใช่ undefined (P6 พิสูจน์แล้วกับ CACHE_MAX_MISSING_* ของ heartbeat)
      - name: อุ่นแคช (CACHE_WARM_RUN=1)
        id: warm
        run: npx vitest run lib/__tests__/cacheWarmRun.test.ts
        env:
          CACHE_WARM_RUN: "1"
          CACHE_WARM_LIMIT: ${{ github.event.inputs.limit }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SERVICE_ROLE_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

      # 🔴 แก้ 3 ก.ย. 2026 (P6) — post-check ที่เคยวางแผนไว้ (`admin.rpc("assert_cache_lockdown")`)
      #    **เรียกไม่ได้จริง** ไม่ว่าจะมี `grant execute ... to service_role` (ข้อยกเว้นที่ 7) หรือไม่
      #    ยิงทดสอบจริงแล้วได้ `PGRST` error: "Could not find the function public.assert_cache_lockdown
      #    ... in the schema cache" — เพราะ `app` schema **ไม่ถูก expose ผ่าน PostgREST เลยโดยตั้งใจ**
      #    (`guards.sh` ยืนยันเอง: "✅ api-config: ไม่มี db_pre_request · schema app ไม่ถูก expose")
      #    grant แค่เปิดสิทธิ์ระดับ SQL — ไม่ได้เปิดเส้นทาง REST ให้เรียกถึง ด่านสองอย่างนี้คนละชั้น
      # 🎯 ไม่มี `pg` connection string ใน CI/`.env.local` (P4 วัดไว้แล้วตอนสร้าง fixture lock)
      #    → ไม่มีทางเรียกฟังก์ชันใน schema `app` จากที่นี่ได้เลยตอนนี้ ไม่ใช่แค่ยังไม่ได้เขียนโค้ด
      # 📌 ทางที่เป็นไปได้ถ้าอยากได้ post-check จริง: (ก) เพิ่ม thin wrapper ใน schema `public` ที่เรียก
      #    `app.assert_cache_lockdown()` ต่อ (ข) เพิ่ม pg connection string เป็น secret แล้วใช้ `pg` แทน
      #    supabase-js — ทั้งคู่เป็นการตัดสินใจเรื่อง surface ใหม่ ส่งให้ P1 ตัดสิน ไม่ทำเองตรงนี้
