name: cache-warm

# `Q3` ก้าวที่ 2 — ตัวรัน "อุ่นแคช" ที่ถือ service_role และอยู่นอกเส้นทาง request (P1 ขอ · P6 ทำ)
#
# 🔴 แก้ 4 ก.ย. 2026 — ผู้ใช้อนุมัติแล้ว: **เปิดรายชั่วโมง `limit: 5`** (ยกให้ P1 ถามพร้อมราคาสองทาง
#    — `limit 3` เดิม 144 คำขอ/วัน สำรองแค่ 1.6 เท่า vs `limit 5` ~240 คำขอ/วัน สำรองมากกว่า
#    รับกับคลังที่ P5 กำลังเพิ่มต่อ) **`schedule` เปิดแล้วในไฟล์นี้ตามนั้น**
#
# 🔴 **แต่ยังไม่มีอะไรยิงจริงจนกว่าจะแก้ปัญหาที่ใหญ่กว่า — ห้ามอ่านว่า "เปิดแล้ว = รันแล้ว":**
#    `workflow_dispatch`/`schedule` อ่าน workflow จาก **default branch (`main`) เท่านั้น** และ
#    `origin/main` ไม่มีโฟลเดอร์ `.github/` เลย (ยืนยันซ้ำแล้ว `git ls-tree -r origin/main | grep -c '^\.github/'` = 0)
#    → ไฟล์นี้จะ **นิ่งสนิทจนกว่าจะมีคนแก้เรื่องนั้นแยกต่างหาก** (ตัวเลือกที่ยกให้ผู้ใช้: ก๊อป workflow
#    ไป `main` · เปลี่ยน default branch · ย้ายไป `pg_cron`/Vercel Cron) — การเปิด `schedule` ที่นี่คือ
#    "เตรียมพร้อม" ไม่ใช่ "ทำให้ทำงาน" **ไม่ได้กด `workflow_dispatch`/push จากที่นี่ ต้องรอผู้ใช้ของ
#    เซสชันนี้อนุมัติแยกต่างหากตามปกติ** (`TEAM.md §3.3` — สิทธิ์อนุมัติ push/ยิงจริงมาจากผู้ใช้ของ
#    เซสชันนั้นเท่านั้น มติที่ถูกต้องจากที่อื่นก็มอบแทนกันไม่ได้)
#
# 🎯 **ความถี่ cron — วัดสดจาก `engine-dev` ตอนแก้ไฟล์นี้ (4 ก.ย. 2026) ไม่ใช่เดาจากขนาดคลังดิบ:**
#    ขาดจริง (ไม่ใช่คลังทั้งหมด — ตัดคีย์ที่แคชแล้ว/ไม่มีคีย์ให้แคชออกแล้ว) = **719 details · 720 photos**
#    (คลังรวมวันนี้ 921 แห่ง แต่ P5 กำลังเพิ่มต่อ — เลขนี้จะเก่าเร็ว ห้ามอ้างเป็นค่าคงที่)
#    `CACHE_REFRESH_AFTER_DAYS=20` (ตัวอุ่นเริ่มไล่ต่ออายุ) vs `CACHE_MAX_AGE_DAYS=30` (heartbeat ถือว่าขาด)
#    ⇒ มีแค่ **10 วัน** ให้ไล่คีย์ที่ขาดก่อนจะเข้าเกณฑ์ "ขาด" ของ heartbeat เอง
#    ```
#    limit=5 ต่อรอบ · schedule รายชั่วโมง (24 รอบ/วัน) = 120 คีย์/วัน/ตาราง
#    719÷120 ≈ 6.0 วัน (details) · 720÷120 = 6.0 วัน (photos) — อยู่ใน 10 วัน มีสำรอง ~1.7 เท่า
#    ราคา: (5+5) × 24 = 240 คำขอ Google/วัน
#    ```
#    🔴 **ถ้าคลังโตอีกมาก (P5 ยังเพิ่มอยู่) ตัวเลขข้างบนต้องวัดซ้ำ ไม่ใช่คำนวณจากคอมเมนต์นี้ต่อ** —
#    รันไฟล์เทสต์ heartbeat แล้วอ่านจำนวน "ขาด" จริงจากผลนั้นเสมอ
#
# 🔴 อย่าใส่ `CRON_SECRET`/เรียกผ่าน Next.js API — service_role key ต้องอยู่ที่เดียวกับที่มันอยู่แล้ว
#    (secret ของ job `rls` ใน `ci.yml`) ไม่ใช่โผล่ในที่ที่สาม

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "เพดานจำนวนคีย์ที่จะอุ่นรอบนี้ (default 5 — ผู้ใช้อนุมัติแล้ว ตรงกับสูตรความถี่ด้านบน)"
        required: false
        default: "5"
  schedule:
    - cron: "0 * * * *"   # รายชั่วโมง — ตามที่ผู้ใช้อนุมัติ (4 ก.ย. 2026) · ยังไม่ยิงจริงจนกว่า default-branch จะแก้ (ดูหัวไฟล์)

jobs:
  warm:
    runs-on: ubuntu-latest
    # 🔴 เหมือน job `rls` ทุกประการ — กันสองรอบชนกันบนฐานเดียวกัน (schedule ในอนาคตจะรันถี่กว่า push)
    concurrency:
      group: engine-dev-live
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.12.2'
          cache: npm
      - run: npm ci

      # 🔴 ต้องมาก่อนแตะฐานเสมอ — ของเดิมที่ job `rls` ใช้อยู่แล้ว ไม่เขียนด่านใหม่ซ้ำ
      - name: ยืนยันว่า secret ชี้ engine-dev ก่อนแตะ DB
        run: .github/check-ci-target.py
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.DEV_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SERVICE_ROLE_KEY }}

      # 🔴 CACHE_WARM_RUN=1 ต้องตั้งชัดเจน — ค่าตั้งต้นของไฟล์เทสต์คือ "ไม่ทำงาน" โดยตั้งใจ
      #    CACHE_WARM_LIMIT ใช้ envInt() (trim แล้วเช็คว่าง) ไม่ใช่ `??` — GH Actions ให้ input
      #    ที่เว้นว่างเป็นสตริงว่าง ไม่ใช่ undefined (P6 พิสูจน์แล้วกับ CACHE_MAX_MISSING_* ของ heartbeat)
      # 🔴 แก้ 3 ก.ย. 2026 (P6) — เจอเองก่อนเปิด schedule: `github.event.inputs.limit` **ไม่มีอยู่เลย**
      #    ตอนถูกยิงจาก `schedule` (มีแค่ `workflow_dispatch` เท่านั้นที่มี `inputs`) → ค่าที่ได้คือ
      #    สตริงว่าง → `cacheWarmRun.test.ts` ตกไปใช้ default ของมันเอง (`25`) **ไม่ใช่เพดานที่ตั้งใจ**
      #    ⇒ สูตรความถี่ cron ด้านบนจะผิดทันทีที่ schedule เริ่มรัน ถ้าไม่กันตรงนี้
      #    ใช้ `||` ให้ตกกลับมาที่ `5` เมื่อ `inputs.limit` ว่าง (`schedule`/ทริกเกอร์อื่นที่ไม่มี inputs)
      # 🔴 แก้ 4 ก.ย. 2026 — เปลี่ยน fallback จาก `3` เป็น `5` ตามที่ผู้ใช้อนุมัติ ต้องแก้คู่กับ
      #    `default: "5"` ของ dispatch input ด้านบนเสมอ — ลืมจุดใดจุดหนึ่งจะได้เพดานคนละค่ากันระหว่าง
      #    กดเอง (dispatch) กับรอบอัตโนมัติ (schedule) โดยไม่มีอะไรฟ้อง
      - name: อุ่นแคช (CACHE_WARM_RUN=1)
        id: warm
        run: npx vitest run lib/__tests__/cacheWarmRun.test.ts
        env:
          CACHE_WARM_RUN: "1"
          CACHE_WARM_LIMIT: ${{ github.event.inputs.limit || '5' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SERVICE_ROLE_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

      # 🔴 แก้ 3 ก.ย. 2026 (P1) — ต่อกลับเข้ามาได้แล้วผ่าน wrapper ใหม่ `public.assert_cache_lockdown()`
      #    (`security definer` เรียก `app.assert_cache_lockdown()` ต่อ — เดิม P6 เจอว่า schema `app`
      #    ไม่ expose ผ่าน PostgREST · P1 เพิ่ม wrapper แล้วยังเจอชั้นที่สอง: wrapper แรกเป็น
      #    `security invoker` ทำให้รันด้วยสิทธิ์ `service_role` ซึ่งไม่มี `usage` บน schema `app` —
      #    ต้อง `security definer` ถึงจะข้ามชั้นนั้นได้ · P1 ยิง curl จริงจนได้ 204 ก่อนส่งจุดต่อมา)
      #    P6 ยืนยันซ้ำเองก่อน commit: `service_role` → 204 · `anon` → 401 (42501 permission denied)
      - name: post-check — service_role ไม่ได้เปิดสิทธิ์อะไรเกิน (assert_cache_lockdown)
        if: always()
        run: |
          code="$(curl -s -o /tmp/rpc.json -w '%{http_code}' -X POST \
            "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/rpc/assert_cache_lockdown" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json")"
          if [ "$code" != "204" ]; then
            echo "🔴 assert_cache_lockdown: HTTP $code (คาด 204 — ไม่คืนอะไรตอนผ่าน)"
            cat /tmp/rpc.json
            exit 1
          fi
          echo "✅ assert_cache_lockdown ผ่าน — service_role ไม่ได้เปิดสิทธิ์อะไรเกินที่ประกาศ"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SERVICE_ROLE_KEY }}
